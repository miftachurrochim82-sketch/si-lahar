<!-- ============================================================
     V_RencanaKalender.html — Kalender Rencana Bulanan (G18c-2 KIT)
     Grid 7 kolom (Senin pertama) = custom UI (.cal-cell/.cal-chip
     A0_Style). Kit: <app-badge> (legenda); form modal di V_Modals,
     <app-skeleton>.
     BUGFIX G18c-2: tombol "+ Rencana" dulu membuka showRencanaForm
     yang modalnya hanya ada di V_RencanaKanban → kini kalender punya
     modal sendiri (showRencanaFormKal, dihosting J_Kinerja).
     Klik sel tanggal → buka Kanban terfilter tanggal sel (FR-08).
     ============================================================ -->
<div v-if="currentPage === 'rencana_kalender'" class="space-y-4 animate-fade-in select-none">

  <!-- Header + navigasi bulan -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 border-b border-slate-200/80 dark:border-slate-800 pb-4">
    <div>
      <h2 class="text-2xl font-bold tracking-tight flex items-center gap-2 text-slate-800 dark:text-white">
        <i class="fa-solid fa-calendar-days text-emerald-600 dark:text-emerald-400"></i> Rencana Kalender
      </h2>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">
        Klik sel tanggal untuk membuka papan Kanban pada tanggal itu.
      </p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <select v-if="isAdmin" v-model="rencanaFilters.pegawai_id" @change="loadRencanaKalender()"
              class="input !py-1.5 !text-xs min-w-40">
        <option value="">Semua pegawai</option>
        <option v-for="p in pegawaiList" :key="p.pegawai_id || p.id" :value="p.pegawai_id || p.id">{{ p.nama_lengkap || p.nama }}</option>
      </select>
      <div class="flex items-center gap-1">
        <button @click="calGeser(-1)" class="w-9 h-9 rounded-xl border text-sm font-black transition-all cursor-pointer border-slate-300 text-slate-600 hover:bg-slate-100 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <span class="min-w-40 text-center text-sm font-black text-slate-800 dark:text-white">{{ calLabel }}</span>
        <button @click="calGeser(1)" class="w-9 h-9 rounded-xl border text-sm font-black transition-all cursor-pointer border-slate-300 text-slate-600 hover:bg-slate-100 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
      <button @click="openRencanaForm(null, (todayIso_ ? todayIso_() : ''))" class="btn btn-primary">
        <i class="fa-solid fa-plus"></i> Rencana
      </button>
    </div>
  </div>

  <!-- Grid kalender -->
  <div class="card overflow-hidden !p-0">
    <app-skeleton v-if="calLoading" type="table"></app-skeleton>
    <template v-else>
      <!-- Kepala hari (Senin pertama) -->
      <div class="grid grid-cols-7 text-center text-[10px] font-black uppercase tracking-wider py-2 border-b text-slate-500 border-slate-200 bg-slate-50 dark:text-slate-400 dark:border-slate-800 dark:bg-slate-900">
        <div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div>
        <div class="text-amber-500">Sab</div><div class="text-rose-400">Min</div>
      </div>
      <div class="grid grid-cols-7">
        <div v-for="sel in calCells" :key="sel.key"
             @click="bukaKanbanTanggal(sel.key)"
             :class="['cal-cell', sel.bulanLain ? 'cal-cell-out' : '', sel.hariIni ? 'cal-cell-today' : '']">
          <p class="text-[11px] font-black mb-1"
             :class="[sel.bulanLain ? 'text-slate-300 dark:text-slate-600' : 'text-slate-700 dark:text-slate-200', sel.hariIni ? '!text-emerald-600 dark:!text-emerald-400' : '']">
            {{ sel.angka }}
          </p>
          <div>
            <span v-for="c in sel.chips.slice(0, 3)" :key="c.id"
                  :class="['cal-chip', 'cal-chip-' + String(c.status || 'direncanakan').toLowerCase()]">
              {{ c.rencana_hasil }}
            </span>
            <p v-if="sel.chips.length > 3" class="text-[9px] font-black text-slate-400 px-1">+{{ sel.chips.length - 3 }} lagi</p>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- Legenda status (kit app-badge, cermin warna chip) -->
  <div class="flex flex-wrap items-center gap-2 text-[10px] font-bold">
    <app-badge size="sm" :label="'Direncanakan'"></app-badge>
    <app-badge size="sm" status="proses" label="Dikerjakan"></app-badge>
    <app-badge size="sm" status="emerald" label="Selesai"></app-badge>
    <app-badge size="sm" status="purple" label="Diverifikasi"></app-badge>
    <span class="text-slate-400 px-1">(batal disembunyikan dari kalender)</span>
  </div>

</div>
