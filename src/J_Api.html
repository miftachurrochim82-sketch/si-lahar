<script>
// ============================================================
// SILAHAR - J_Api.html (G18c-2 CLEANUP, 2026-09-19)
// ------------------------------------------------------------
// Loader data aplikasi: laporan v1 + profil.
//
// G15 (2026-09-18): callServer/handleSessionExpired/auth/loadReferensi
// DIHAPUS — AppCore yang menyediakan (loadMasterSIMPEG menggantikan
// loadReferensi).
//
// G18c-2 CLEANUP (2026-09-19): dead code v1 & orphan method DIHAPUS:
//   - loadDashboard / refreshDashboard / renderDashboardCharts
//     (T1) — V_Dashboard pakai loadDashboardKinerja v2; Chart.js
//     tidak lagi dimuat statis, renderDashboardCharts akan
//     ReferenceError bila dipanggil.
//   - loadRiwayat / debouncedLoadRiwayat — V_RiwayatLaporan.html
//     sudah tidak di-include sejak G18c.
//   - loadAnalisa — V_Analisa.html orphan; analisa tim via
//     analisa_kinerja v2 (di J_Kinerja).
//   - loadConfig — V_Pengaturan.html pakai <app-settings> kit
//     (self-contained).
//   - loadPegawai/loadJabatan/loadUnit — V_Master.html pakai
//     computed pegawaiRefFiltered/jabatanRefFiltered/unitRefFiltered
//     (di J_Kinerja).
//
// YANG TERSISA (3 method) — pemakai jelas:
//   - loadLaporan        → V_Master.html tab 'laporan' (via
//                          loadMasterKinerja J_Kinerja).
//   - debouncedLoadLaporan → search debounce tab 'laporan'.
//   - loadProfil         → loadPaspor() J_Kinerja (enrich myProfile).
// ============================================================
window.SilaharApi = {
  methods: {

    // ================= LAPORAN HARIAN v1 (tab Laporan V_Master) =================
    // Server-side pagination + search (action backend: get_laporan_list).
    async loadLaporan(page = 1) {
      this.laporanPage = page;
      this.laporanLoading = true;

      try {
        const res = await this.callServer('get_laporan_list', {
          page,
          limit: this.pageSize,
          search: this.laporanSearch
        });

        if (res && res.success) {
          this.laporanList = Array.isArray(res.data) ? res.data : [];
          this.laporanTotalPages = res.meta?.total_pages || 1;
          this.laporanTotalData = res.meta?.total || this.laporanList.length;
        } else {
          this.laporanList = [];
          this.showToast(res.error || 'Gagal memuat data laporan harian', 'error');
        }
      } catch (e) {
        this.laporanList = [];
        this.showToast('Gagal memuat laporan: ' + e.message, 'error');
      } finally {
        this.laporanLoading = false;
      }
    },

    // F5: ketikan search didebounce 400ms (hemat request server)
    debouncedLoadLaporan() {
      clearTimeout(this._searchTimerLaporan);
      this._searchTimerLaporan = setTimeout(() => this.loadLaporan(1), 400);
    },

    // ================= PROFIL (dipakai loadPaspor J_Kinerja) =================
    // F4: profil diperkaya (termasuk pangkat_golongan dari master).
    async loadProfil() {
      this.profilLoading = true;
      try {
        const res = await this.callServer('get_my_profile');
        if (res.success) {
          this.myProfile = res.data || {};
          this.editProfilForm = {
            alamat:  res.data.alamat  || '',
            no_hp:   res.data.no_hp   || '',
            email:   res.data.email   || ''
          };
        }
      } catch (e) {
        this.showToast(e.message, 'error');
      } finally {
        this.profilLoading = false;
      }
    }

  }
};
</script>
