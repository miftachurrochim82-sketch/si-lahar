<!-- ============================================================
     V_Master.html — Master Terpadu (G18c-2, 2026-09-19)
     ------------------------------------------------------------
     4 tab:
       1) Laporan       — CRUD v1 admin (LAPORAN_HARIAN)
       2) RHK / SKP     — master kinerja (CRUD admin)
       3) Jenis Tugas   — kamus (CRUD admin)
       4) Satuan        — kamus (CRUD admin)

     CATATAN (keputusan pemilik 2026-09-19):
       Tab referensi SIMPEG (Pegawai/Jabatan/Unit Kerja) DIHAPUS
       dari halaman. Alasannya:
         - Read-only — dikelola di SI-PLATFORM/SIMPEG, bukan SILAHAR.
         - Sudah dipakai lewat picker (<app-pegawai-picker>) &
           dropdown pegawai di modal (laporan, RHK, realisasi).
         - Lookup (namaPegawai/namaUnit/namaJabatan) tetap tersedia
           via AppCore.loadMasterSIMPEG (dimuat saat init).
         - Menghemat ruang tab & menyederhanakan halaman.

     State & computed:
       - Tab aktif: activeMasterKinerjaTab (J_Kinerja)
       - Filter master: masterFilters (J_Kinerja) — search + status
         (+ tahun khusus tab RHK)
       - Filter Laporan: laporanSearch + laporanPage (server-side)
       - Semua modal form → V_Modals.
     ============================================================ -->
<div v-if="currentPage === 'master_kinerja' || currentPage === 'master'"
     class="space-y-4 animate-fade-in select-none">

  <!-- ================= HEADER ================= -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 border-b border-slate-200/80 dark:border-slate-800 pb-4">
    <div>
      <h2 class="text-2xl font-bold tracking-tight flex items-center gap-2 text-slate-800 dark:text-white">
        <i class="fa-solid fa-database text-emerald-600 dark:text-emerald-400"></i> Master
      </h2>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">
        Laporan harian & master kinerja (RHK, jenis tugas, satuan).
        <span v-if="!isAdmin" class="font-bold text-amber-500">(tampilan baca — kelola = admin)</span>
      </p>
    </div>
  </div>

  <!-- ================= TAB NAVIGASI (4 tab) ================= -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-2">
    <button v-for="tab in [
        { id: 'laporan', label: 'Laporan',      ikon: 'fa-file-pen',   jumlah: laporanTotalData || 0 },
        { id: 'rhk',     label: 'RHK / SKP',    ikon: 'fa-crosshairs', jumlah: (rhkList || []).length },
        { id: 'jenis',   label: 'Jenis Tugas',  ikon: 'fa-tags',       jumlah: (jenisTugasList || []).length },
        { id: 'satuan',  label: 'Satuan',       ikon: 'fa-ruler',      jumlah: (satuanList || []).length }
      ]" :key="tab.id" @click="activeMasterKinerjaTab = tab.id"
      class="px-4 py-3 rounded-2xl border text-xs font-black transition-all cursor-pointer flex items-center justify-center gap-2"
      :class="activeMasterKinerjaTab === tab.id
        ? 'bg-emerald-600 border-emerald-600 text-white shadow'
        : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800'">
      <i class="fa-solid" :class="tab.ikon"></i>
      <span>{{ tab.label }}</span>
      <span v-if="tab.jumlah" class="px-1.5 py-0.5 rounded-full text-[10px]"
            :class="activeMasterKinerjaTab === tab.id ? 'bg-white/20' : 'bg-slate-100 border border-slate-200 dark:bg-slate-800 dark:border-slate-700'">{{ tab.jumlah }}</span>
    </button>
  </div>

  <!-- ================= FILTER BAR (khusus tab non-Laporan) ================= -->
  <div v-if="activeMasterKinerjaTab !== 'laporan'" class="card p-3 flex flex-col lg:flex-row gap-3">
    <div class="flex-1 min-w-48 relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none"></i>
      <input type="text" v-model="masterFilters.search"
             placeholder="Cari nama, kode, keterangan…"
             class="input !pl-9">
    </div>
    <select v-if="activeMasterKinerjaTab === 'rhk'" v-model="masterFilters.tahun" class="input lg:w-40">
      <option value="">Semua tahun</option>
      <option v-for="y in tahunRhkOptions" :key="y" :value="String(y)">Tahun: {{ y }}</option>
    </select>
    <select v-model="masterFilters.status" class="input lg:w-40">
      <option value="">Semua status</option>
      <option value="aktif">Aktif</option>
      <option value="nonaktif">Nonaktif</option>
    </select>
    <button @click="refreshMasters()" class="btn btn-secondary shrink-0" title="Muat ulang master">
      <i class="fa-solid fa-rotate"></i>
    </button>
    <button v-if="isAdmin" @click="openFormPerTab()"
            class="btn btn-primary btn-lg shrink-0 lg:min-w-44 justify-center">
      <i class="fa-solid fa-plus"></i> {{ labelTambahPerTab }}
    </button>
  </div>

  <!-- ================= FILTER BAR (khusus Laporan — server-side) ================= -->
  <div v-if="activeMasterKinerjaTab === 'laporan'"
       class="card p-3 flex flex-col md:flex-row gap-3 items-stretch md:items-center">
    <div class="relative flex-1">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
      <input v-model="laporanSearch"
             @input="debouncedLoadLaporan"
             placeholder="Cari deskripsi, hasil, kendala..."
             class="input !pl-9">
    </div>
    <button @click="resetLaporanFilter"
            class="btn btn-secondary">
      <i class="fa-solid fa-rotate-right"></i> Reset
    </button>
    <button v-if="isAdmin" @click="openLaporanForm()" class="btn btn-primary btn-lg">
      <i class="fa-solid fa-plus"></i> Laporan Baru
    </button>
  </div>

  <app-skeleton v-if="mastersLoading || laporanLoading" type="table"></app-skeleton>

  <!-- ============ TAB 1: LAPORAN HARIAN ============ -->
  <template v-else-if="activeMasterKinerjaTab === 'laporan'">
    <app-crud-table :items="laporanList"
                    :loading="laporanLoading"
                    :page="laporanPage"
                    :total-pages="laporanTotalPages"
                    :total-data="laporanTotalData"
                    empty-text="Belum ada laporan."
                    empty-icon="fa-solid fa-file-pen"
                    :columns="[
                      { label: 'Tanggal' }, { label: 'Pegawai' }, { label: 'Jenis' },
                      { label: 'Deskripsi & Hasil' }, { label: 'Kendala & TL' },
                      { label: 'Status', thClass: 'text-center' },
                      { label: 'Aksi', thClass: 'text-right pr-6' }
                    ]"
                    @change-page="loadLaporan($event)">
      <template #row="{ row }">
        <td class="py-3 px-4 font-bold whitespace-nowrap text-slate-700 dark:text-slate-300">
          <i class="fa-regular fa-calendar text-slate-400 mr-1.5"></i>{{ formatDateDisplay(row.tanggal) }}
        </td>
        <td class="py-3 px-4">
          <div class="font-bold text-slate-900 dark:text-white">{{ namaPegawai(row.pegawai_id) }}</div>
          <div class="text-[10px] text-slate-400 font-mono" v-if="row.pegawai_id">ID: {{ row.pegawai_id }}</div>
        </td>
        <td class="py-3 px-4 whitespace-nowrap">
          <app-badge size="sm" :label="row.jenis_kegiatan || 'umum'"></app-badge>
        </td>
        <td class="py-3 px-4 max-w-64">
          <div class="font-semibold text-slate-800 dark:text-slate-200 line-clamp-2">{{ row.deskripsi || '—' }}</div>
          <div v-if="row.hasil" class="text-[11px] text-emerald-600 dark:text-emerald-400 font-bold mt-1 line-clamp-1">
            <i class="fa-solid fa-circle-check text-[9px] mr-1"></i>{{ row.hasil }}
          </div>
        </td>
        <td class="py-3 px-4 text-[11px]">
          <div v-if="row.kendala" class="text-rose-600 dark:text-rose-400 font-bold line-clamp-1">
            <i class="fa-solid fa-triangle-exclamation mr-1"></i>{{ row.kendala }}
          </div>
          <div v-if="row.tindak_lanjut" class="text-slate-500 dark:text-slate-400 line-clamp-1 mt-0.5">
            <i class="fa-solid fa-arrow-right mr-1"></i>{{ row.tindak_lanjut }}
          </div>
          <div v-if="!row.kendala && !row.tindak_lanjut" class="text-slate-400 italic">—</div>
        </td>
        <td class="py-3 px-4 text-center">
          <app-badge size="sm"
                     :status="badgeVerif_(row.status_verifikasi).status"
                     :label="badgeVerif_(row.status_verifikasi).label"></app-badge>
        </td>
        <td class="py-3 pl-4 pr-6 text-right whitespace-nowrap">
          <button v-if="canEditLaporan(row)" @click="openLaporanForm(row)" class="btn-icon mr-1.5" title="Edit">
            <i class="fa-solid fa-pen-to-square"></i>
          </button>
          <button v-if="canEditLaporan(row)" @click="confirmDeleteLaporan(row)" class="btn-icon btn-icon-danger" title="Hapus">
            <i class="fa-solid fa-trash"></i>
          </button>
        </td>
      </template>
    </app-crud-table>
  </template>

  <!-- ============ TAB 2: RHK / SKP ============ -->
  <template v-else-if="activeMasterKinerjaTab === 'rhk'">
    <p class="text-xs font-black uppercase tracking-wider text-slate-400">RHK / Sasaran Kinerja (periode tahunan)</p>
    <app-crud-table :items="rhkFiltered" :page="1" :total-pages="1" :total-data="rhkFiltered.length"
                    :empty-text="isAdmin ? 'Belum ada RHK. Klik RHK Baru.' : 'RHK milik Anda belum dibuat admin.'"
                    :columns="[
                      { label: 'Pegawai' }, { label: 'Tahun' }, { label: 'Jenis' },
                      { label: 'Nama RHK (hasil)' }, { label: 'Indikator' }, { label: 'Target' },
                      { label: 'Status' }, { label: 'Aksi', thClass: isAdmin ? 'text-right pr-6' : 'hidden' }
                    ]">
      <template #row="{ row }">
        <td class="py-3 px-4 font-bold text-slate-700 dark:text-slate-300">{{ namaPegawai(row.pegawai_id) }}</td>
        <td class="py-3 px-4 text-slate-700 dark:text-slate-300">{{ row.periode_tahun }}</td>
        <td class="py-3 px-4">
          <app-badge size="sm" :status="row.jenis_rhk === 'utama' ? 'aktif' : 'menunggu'"
                     :label="row.jenis_rhk === 'utama' ? 'Utama' : 'Tambahan'"></app-badge>
        </td>
        <td class="py-3 px-4 max-w-56 font-bold leading-snug text-slate-800 dark:text-slate-100">{{ row.nama_rhk }}</td>
        <td class="py-3 px-4 max-w-48 text-slate-400">{{ row.indikator || '—' }}</td>
        <td class="py-3 px-4 whitespace-nowrap font-black text-slate-700 dark:text-slate-300">{{ row.target_tahunan }} {{ namaSatuan_(row.satuan_id) }}</td>
        <td class="py-3 px-4">
          <app-badge size="sm" :status="row.status === 'nonaktif' ? 'inactive' : 'aktif'"
                     :label="row.status || 'aktif'"></app-badge>
        </td>
        <td class="py-3 pl-4 pr-6 text-right whitespace-nowrap" :class="isAdmin ? '' : 'hidden'">
          <button v-if="isAdmin" @click="openRhkForm(row)" class="btn-icon mr-1.5">
            <i class="fa-solid fa-pen-to-square"></i>
          </button>
          <button v-if="isAdmin" @click="deleteRhk(row)" class="btn-icon btn-icon-danger">
            <i class="fa-solid fa-trash"></i>
          </button>
        </td>
      </template>
    </app-crud-table>
  </template>

  <!-- ============ TAB 3: JENIS TUGAS ============ -->
  <template v-else-if="activeMasterKinerjaTab === 'jenis'">
    <p class="text-xs font-black uppercase tracking-wider text-slate-400">Kamus Jenis Tugas</p>
    <app-crud-table :items="jenisFiltered" :page="1" :total-pages="1" :total-data="jenisFiltered.length"
                    empty-text="Kamus jenis tugas masih kosong."
                    :columns="[
                      { label: 'Kode' }, { label: 'Nama' }, { label: 'Keterangan' }, { label: 'Status' },
                      { label: 'Aksi', thClass: isAdmin ? 'text-right pr-6' : 'hidden' }
                    ]">
      <template #row="{ row }">
        <td class="py-3 px-4 font-mono font-black text-slate-700 dark:text-slate-300">{{ row.kode }}</td>
        <td class="py-3 px-4 font-bold text-slate-800 dark:text-slate-100">{{ row.nama }}</td>
        <td class="py-3 px-4 text-slate-400">{{ row.keterangan || '—' }}</td>
        <td class="py-3 px-4">
          <app-badge size="sm" :status="row.status === 'nonaktif' ? 'inactive' : 'aktif'" :label="row.status || 'aktif'"></app-badge>
        </td>
        <td class="py-3 pl-4 pr-6 text-right" :class="isAdmin ? '' : 'hidden'">
          <button v-if="isAdmin" @click="openJenisForm(row)" class="btn-icon">
            <i class="fa-solid fa-pen-to-square"></i>
          </button>
        </td>
      </template>
    </app-crud-table>
  </template>

  <!-- ============ TAB 4: SATUAN ============ -->
  <template v-else>
    <p class="text-xs font-black uppercase tracking-wider text-slate-400">Kamus Satuan Hasil Kerja</p>
    <app-crud-table :items="satuanFiltered" :page="1" :total-pages="1" :total-data="satuanFiltered.length"
                    empty-text="Kamus satuan masih kosong."
                    :columns="[
                      { label: 'Kode' }, { label: 'Nama' }, { label: 'Keterangan' }, { label: 'Status' },
                      { label: 'Aksi', thClass: isAdmin ? 'text-right pr-6' : 'hidden' }
                    ]">
      <template #row="{ row }">
        <td class="py-3 px-4 font-mono font-black text-slate-700 dark:text-slate-300">{{ row.kode }}</td>
        <td class="py-3 px-4 font-bold text-slate-800 dark:text-slate-100">{{ row.nama }}</td>
        <td class="py-3 px-4 text-slate-400">{{ row.keterangan || '—' }}</td>
        <td class="py-3 px-4">
          <app-badge size="sm" :status="row.status === 'nonaktif' ? 'inactive' : 'aktif'" :label="row.status || 'aktif'"></app-badge>
        </td>
        <td class="py-3 pl-4 pr-6 text-right" :class="isAdmin ? '' : 'hidden'">
          <button v-if="isAdmin" @click="openSatuanForm(row)" class="btn-icon">
            <i class="fa-solid fa-pen-to-square"></i>
          </button>
        </td>
      </template>
    </app-crud-table>
  </template>

</div>
