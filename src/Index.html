  <!-- ============================================================
       GAYA KUSTOM SILAHAR (G18c-2)
       Dipindah dari A0_Style.html inline (keputusan pemilik

  <style>
    /* ---------- KANBAN (V_Rencana mode kanban) ---------- */
    .kanban-col {
      border-radius: 1rem;
      padding: 0.75rem;
      min-height: 10rem;
      border: 1px solid rgba(226, 232, 240, 0.9);
      background: #f8fafc;
    }
    .dark .kanban-col { background: rgba(15, 23, 42, 0.6); border-color: #1e293b; }
    .kanban-col-mute { opacity: 0.7; }

    .kanban-card {
      border-radius: 0.75rem;
      padding: 0.75rem;
      border: 1px solid #e2e8f0;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }
    .kanban-card:hover { box-shadow: 0 6px 16px -6px rgba(0, 0, 0, 0.18); transform: translateY(-1px); }
    .dark .kanban-card { background: #0f172a; border-color: rgba(51, 65, 85, 0.7); }

    /* ---------- KALENDER (V_Rencana mode kalender) ----------
       Poles 2026-09-19 (review pemilik): sel tanggal jadi KARTU
       ber-gap; chip diberi napas; min-height dinaikkan agar chip
       tidak overflow ke luar sel (fix T39). */
    .cal-cell {
      min-height: 7rem;                /* 5.5rem → 7rem (fix T39) */
      padding: 0.5rem 0.5rem 0.375rem;
      border: 1px solid #e2e8f0;
      border-radius: 0.6rem;
      background: #fff;
      cursor: pointer;
      transition: background 0.12s ease, box-shadow 0.12s ease;
    }
    .cal-cell:hover { background: rgba(16, 185, 129, 0.06); box-shadow: 0 2px 8px -2px rgba(16, 185, 129, 0.25); }
    .dark .cal-cell { border-color: #1e293b; background: #0f172a; }
    .dark .cal-cell:hover { background: rgba(16, 185, 129, 0.1); }
    .cal-cell-out { background: rgba(248, 250, 252, 0.8); border-style: dashed; }
    .dark .cal-cell-out { background: rgba(2, 6, 23, 0.6); }
    .cal-cell-today { box-shadow: inset 0 0 0 2px #10b981; }

    .cal-chip {
      display: block;
      width: 100%;
      padding: 3px 6px;              /* 2px 5px → 3px 6px (fix T39) */
      margin-bottom: 3px;            /* 4px → 3px (fix T39) */
      border-radius: 6px;
      font-size: 10px;               /* 9px → 10px (fix T39, lebih mudah dibaca) */
      font-weight: 700;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid transparent;
    }
    /* Warna chip = cermin status rencana */
    .cal-chip-direncanakan { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
    .cal-chip-dikerjakan   { background: #fef3c7; color: #b45309; border-color: #fde68a; }
    .cal-chip-selesai      { background: #d1fae5; color: #047857; border-color: #a7f3d0; }
    .cal-chip-diverifikasi { background: #e0e7ff; color: #4338ca; border-color: #c7d2fe; }
    .dark .cal-chip-direncanakan { background: #1e293b; color: #cbd5e1; border-color: #334155; }
    .dark .cal-chip-dikerjakan   { background: rgba(120, 53, 15, 0.4); color: #fcd34d; border-color: #92400e; }
    .dark .cal-chip-selesai      { background: rgba(6, 78, 59, 0.4); color: #6ee7b7; border-color: #065f46; }
    .dark .cal-chip-diverifikasi { background: rgba(49, 46, 129, 0.4); color: #a5b4fc; border-color: #3730a3; }

    /* ---------- Bar capaian tipis (dashboard/tim/rekap) ---------- */
    .mini-progress { height: 6px; border-radius: 9999px; overflow: hidden; background: #e2e8f0; }
    .dark .mini-progress { background: #1e293b; }
    .mini-progress > div { height: 100%; border-radius: 9999px; }

    /* Sisa v-cloak (sebelum CSS kit termuat) */
    [v-cloak] { display: none !important; }
  </style>
