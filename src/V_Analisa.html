<!-- ============================================================
     V_Analisa.html — Halaman Analisa & Rekomendasi (SILAHAR UI/UX)
     ============================================================ -->
<div v-if="currentPage === 'analisa'" class="space-y-6 animate-fade-in select-none">

  <!-- ================= HEADER HALAMAN ================= -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 border-b border-slate-200/80 dark:border-slate-800 pb-4">
    <div>
      <h2 class="text-2xl font-bold tracking-tight flex items-center gap-2" :class="isDarkMode ? 'text-white' : 'text-slate-800'">
        <i class="fa-solid fa-chart-line text-indigo-600 dark:text-indigo-400"></i> Analisa & Rekomendasi Executive
      </h2>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">
        Wawasan otomatis hasil sintesis data laporan harian dan saran tindakan strategis.
      </p>
    </div>

    <!-- Refresh Button -->
    <button @click="loadAnalisa" 
            :disabled="analisaLoading"
            class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 disabled:opacity-50 text-white font-bold text-xs rounded-xl shadow-sm transition-all flex items-center justify-center gap-2 cursor-pointer shrink-0">
      <i class="fa-solid fa-rotate text-sm" :class="{ 'animate-spin': analisaLoading }"></i>
      <span>{{ analisaLoading ? 'Menyusun Analisa...' : 'Sintesis Ulang Data' }}</span>
    </button>
  </div>

  <!-- ================= LOADING STATE SKELETON ================= -->
  <div v-if="analisaLoading" class="grid grid-cols-1 md:grid-cols-3 gap-4 animate-pulse">
    <div class="md:col-span-3 p-6 rounded-2xl bg-slate-200 dark:bg-slate-800 h-28"></div>
    <div v-for="i in 3" :key="'skel-analisa-'+i" class="p-5 rounded-2xl bg-slate-200 dark:bg-slate-800 h-64"></div>
  </div>

  <template v-else-if="analisaData">
    
    <!-- ================= RINGKASAN EKSEKUTIF CARD ================= -->
    <div :class="[
      'p-6 rounded-3xl border shadow-sm transition-all duration-300 relative overflow-hidden',
      isDarkMode 
        ? 'bg-gradient-to-r from-slate-900 via-slate-900 to-indigo-950 border-slate-800 text-slate-200' 
        : 'bg-gradient-to-r from-indigo-900 via-slate-900 to-slate-800 border-indigo-950 text-white shadow-indigo-950/10'
    ]">
      <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="space-y-2">
          <div class="flex items-center gap-2">
            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
              <i class="fa-solid fa-brain mr-1"></i> Executive Insight
            </span>
            <span class="text-[11px] text-slate-300 font-medium" v-if="analisaData.generated_at">
              Diproses pada {{ formatDateDisplay(analisaData.generated_at) }}
            </span>
          </div>

          <h3 class="text-xl sm:text-2xl font-black tracking-tight text-white">
            Ringkasan Hasil Analisis
          </h3>

          <p class="text-xs sm:text-sm text-slate-200 leading-relaxed max-w-3xl">
            {{ analisaData.ringkasan || 'Tidak ada ringkasan teks yang dihasilkan.' }}
          </p>
        </div>

        <div class="shrink-0 p-4 rounded-2xl bg-white/10 backdrop-blur-md border border-white/10 text-center min-w-[140px]">
          <span class="text-[10px] font-extrabold uppercase tracking-wider text-indigo-200 block">Total Sampel</span>
          <span class="text-3xl font-black text-white block mt-0.5">{{ analisaData.total_data || 0 }}</span>
          <span class="text-[10px] text-slate-300 font-semibold block mt-0.5">Laporan Harian</span>
        </div>
      </div>
    </div>

    <!-- ================= KARTU DISTRIBUSI STATISTIK ================= -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
      
      <!-- Distribusi 1: Per Jenis Kegiatan -->
      <div :class="[
        'p-5 rounded-2xl border shadow-sm flex flex-col justify-between transition-all duration-300',
        isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200/80'
      ]">
        <div>
          <div class="flex items-center justify-between mb-3 border-b pb-3" :class="isDarkMode ? 'border-slate-800' : 'border-slate-100'">
            <h4 class="text-sm font-bold flex items-center gap-2" :class="isDarkMode ? 'text-white' : 'text-slate-800'">
              <i class="fa-solid fa-tags text-indigo-600 dark:text-indigo-400"></i> Jenis Kegiatan
            </h4>
            <span class="text-[10px] font-extrabold text-slate-400 uppercase">Kategori</span>
          </div>

          <div class="space-y-2.5">
            <div v-for="(jumlah, jenis) in analisaData.by_jenis" :key="'jenis-'+jenis" 
                 class="flex items-center justify-between p-2.5 rounded-xl transition-colors"
                 :class="isDarkMode ? 'bg-slate-800/50' : 'bg-slate-50'">
              <span class="text-xs font-bold capitalize text-slate-700 dark:text-slate-300 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full" 
                      :class="{
                        'bg-blue-500': String(jenis).toLowerCase() === 'rutin',
                        'bg-amber-500': String(jenis).toLowerCase() === 'insidental',
                        'bg-purple-500': String(jenis).toLowerCase() === 'khusus',
                        'bg-teal-500': String(jenis).toLowerCase() === 'lapangan',
                        'bg-orange-500': String(jenis).toLowerCase() === 'administrasi'
                      }"></span>
                {{ jenis }}
              </span>
              <span class="px-2.5 py-1 bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 rounded-lg text-xs font-black shadow-2xs border border-slate-200/60 dark:border-slate-600">
                {{ jumlah }}
              </span>
            </div>

            <div v-if="!analisaData.by_jenis || !Object.keys(analisaData.by_jenis).length" class="text-center py-6 text-xs text-slate-400">
              Data jenis kegiatan tidak tersedia.
            </div>
          </div>
        </div>
      </div>

      <!-- Distribusi 2: Per Tanggal -->
      <div :class="[
        'p-5 rounded-2xl border shadow-sm flex flex-col justify-between transition-all duration-300',
        isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200/80'
      ]">
        <div>
          <div class="flex items-center justify-between mb-3 border-b pb-3" :class="isDarkMode ? 'border-slate-800' : 'border-slate-100'">
            <h4 class="text-sm font-bold flex items-center gap-2" :class="isDarkMode ? 'text-white' : 'text-slate-800'">
              <i class="fa-regular fa-calendar-days text-teal-600 dark:text-teal-400"></i> Laporan per Tanggal
            </h4>
            <span class="text-[10px] font-extrabold text-slate-400 uppercase">Kronologis</span>
          </div>

          <div class="space-y-2.5 max-h-60 overflow-y-auto no-scrollbar pr-1">
            <div v-for="(jumlah, tanggal) in analisaData.by_tanggal" :key="'tgl-'+tanggal" 
                 class="flex items-center justify-between p-2.5 rounded-xl transition-colors"
                 :class="isDarkMode ? 'bg-slate-800/50' : 'bg-slate-50'">
              <span class="text-xs font-semibold text-slate-700 dark:text-slate-300">
                <i class="fa-regular fa-clock text-slate-400 mr-1.5"></i>{{ formatDateDisplay(tanggal) }}
              </span>
              <span class="px-2.5 py-1 bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300 rounded-lg text-xs font-black border border-teal-200 dark:border-teal-800">
                {{ jumlah }} lap
              </span>
            </div>

            <div v-if="!analisaData.by_tanggal || !Object.keys(analisaData.by_tanggal).length" class="text-center py-6 text-xs text-slate-400">
              Data tanggal kegiatan tidak tersedia.
            </div>
          </div>
        </div>
      </div>

      <!-- Distribusi 3: Per Pegawai -->
      <div :class="[
        'p-5 rounded-2xl border shadow-sm flex flex-col justify-between transition-all duration-300',
        isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200/80'
      ]">
        <div>
          <div class="flex items-center justify-between mb-3 border-b pb-3" :class="isDarkMode ? 'border-slate-800' : 'border-slate-100'">
            <h4 class="text-sm font-bold flex items-center gap-2" :class="isDarkMode ? 'text-white' : 'text-slate-800'">
              <i class="fa-solid fa-users text-emerald-600 dark:text-emerald-400"></i> Kontribusi Pegawai
            </h4>
            <span class="text-[10px] font-extrabold text-slate-400 uppercase">Aktif</span>
          </div>

          <div class="space-y-2.5 max-h-60 overflow-y-auto no-scrollbar pr-1">
            <div v-for="(jumlah, pegawaiId) in analisaData.by_pegawai" :key="'peg-'+pegawaiId" 
                 class="flex items-center justify-between p-2.5 rounded-xl transition-colors"
                 :class="isDarkMode ? 'bg-slate-800/50' : 'bg-slate-50'">
              <div class="min-w-0 pr-2">
                <p class="text-xs font-bold text-slate-800 dark:text-slate-200 truncate">
                  {{ namaPegawai(pegawaiId) }}
                </p>
                <p class="text-[10px] text-slate-400 font-mono truncate" v-if="pegawaiId !== 'tanpa_pegawai'">
                  {{ pegawaiId }}
                </p>
              </div>
              <span class="px-2.5 py-1 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 rounded-lg text-xs font-black border border-emerald-200 dark:border-emerald-800 shrink-0">
                {{ jumlah }}
              </span>
            </div>

            <div v-if="!analisaData.by_pegawai || !Object.keys(analisaData.by_pegawai).length" class="text-center py-6 text-xs text-slate-400">
              Data kontribusi pegawai tidak tersedia.
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- ================= TEMUAN & REKOMENDASI GRID ================= -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <!-- Panel 1: Temuan Penting -->
      <div :class="[
        'p-6 rounded-2xl border shadow-sm transition-all duration-300',
        isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200/80'
      ]">
        <div class="flex items-center justify-between mb-4 border-b pb-3" :class="isDarkMode ? 'border-slate-800' : 'border-slate-100'">
          <h3 class="text-base font-bold flex items-center gap-2" :class="isDarkMode ? 'text-white' : 'text-slate-800'">
            <i class="fa-solid fa-magnifying-glass-chart text-amber-500"></i> Temuan Penting Analisis
          </h3>
          <span class="px-2 py-0.5 bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 text-[10px] font-extrabold rounded-md uppercase border border-amber-200 dark:border-amber-800">
            {{ (analisaData.temuan || []).length }} Temuan
          </span>
        </div>

        <div class="space-y-3">
          <div v-for="(temuan, idx) in analisaData.temuan" :key="'temuan-'+idx" 
               class="p-3.5 rounded-xl border flex items-start gap-3 transition-all"
               :class="{
                 'bg-rose-50/80 border-rose-200 text-rose-800 dark:bg-rose-950/40 dark:border-rose-900/60 dark:text-rose-200': temuan.level === 'kritis',
                 'bg-amber-50/80 border-amber-200 text-amber-800 dark:bg-amber-950/40 dark:border-amber-900/60 dark:text-amber-200': temuan.level === 'penting',
                 'bg-blue-50/80 border-blue-200 text-blue-800 dark:bg-blue-950/40 dark:border-blue-900/60 dark:text-blue-200': temuan.level !== 'kritis' && temuan.level !== 'penting'
               }">
            <div class="shrink-0 text-base mt-0.5">
              <i v-if="temuan.level === 'kritis'" class="fa-solid fa-circle-exclamation text-rose-600 dark:text-rose-400"></i>
              <i v-else-if="temuan.level === 'penting'" class="fa-solid fa-triangle-exclamation text-amber-600 dark:text-amber-400"></i>
              <i v-else class="fa-solid fa-circle-info text-blue-600 dark:text-blue-400"></i>
            </div>
            <div class="min-w-0 flex-1">
              <span class="text-[10px] font-black uppercase tracking-wider block mb-0.5 opacity-80">
                Level {{ temuan.level || 'Info' }}
              </span>
              <p class="text-xs font-semibold leading-relaxed">
                {{ temuan.pesan }}
              </p>
            </div>
          </div>

          <div v-if="!analisaData.temuan || !analisaData.temuan.length" class="text-center py-8 text-xs text-slate-400 italic">
            Belum ada temuan khusus yang terdeteksi.
          </div>
        </div>
      </div>

      <!-- Panel 2: Rekomendasi Tindak Lanjut -->
      <div :class="[
        'p-6 rounded-2xl border shadow-sm transition-all duration-300',
        isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200/80'
      ]">
        <div class="flex items-center justify-between mb-4 border-b pb-3" :class="isDarkMode ? 'border-slate-800' : 'border-slate-100'">
          <h3 class="text-base font-bold flex items-center gap-2" :class="isDarkMode ? 'text-white' : 'text-slate-800'">
            <i class="fa-solid fa-lightbulb text-emerald-500"></i> Rekomendasi Tindak Lanjut
          </h3>
          <span class="px-2 py-0.5 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 text-[10px] font-extrabold rounded-md uppercase border border-emerald-200 dark:border-emerald-800">
            {{ (analisaData.rekomendasi || []).length }} Aksi
          </span>
        </div>

        <div class="space-y-3">
          <div v-for="(rekom, idx) in analisaData.rekomendasi" :key="'rekom-'+idx" 
               class="p-3.5 rounded-xl border flex items-start gap-3 transition-all"
               :class="isDarkMode ? 'bg-slate-800/40 border-slate-800' : 'bg-slate-50 border-slate-200/80'">
            
            <span :class="{
              'bg-rose-100 text-rose-700 border-rose-200 dark:bg-rose-950/60 dark:text-rose-300 dark:border-rose-800': String(rekom.prioritas).toLowerCase() === 'tinggi',
              'bg-amber-100 text-amber-700 border-amber-200 dark:bg-amber-950/60 dark:text-amber-300 dark:border-amber-800': String(rekom.prioritas).toLowerCase() === 'sedang',
              'bg-emerald-100 text-emerald-700 border-emerald-200 dark:bg-emerald-950/60 dark:text-emerald-300 dark:border-emerald-800': String(rekom.prioritas).toLowerCase() === 'rendah' || !rekom.prioritas
            }" class="shrink-0 px-2 py-0.5 rounded-md text-[10px] font-extrabold uppercase border mt-0.5">
              {{ rekom.prioritas || 'Sedang' }}
            </span>

            <p class="text-xs font-semibold text-slate-700 dark:text-slate-300 leading-relaxed flex-1">
              {{ rekom.tindakan }}
            </p>
          </div>

          <div v-if="!analisaData.rekomendasi || !analisaData.rekomendasi.length" class="text-center py-8 text-xs text-slate-400 italic">
            Belum ada rekomendasi tindakan khusus.
          </div>
        </div>
      </div>

    </div>

  </template>

  <!-- ================= EMPTY STATE ANALISA ================= -->
  <div v-else class="text-center py-16 p-8 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800">
    <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 text-slate-400 rounded-3xl flex items-center justify-center mx-auto mb-4 text-2xl">
      <i class="fa-solid fa-chart-bar"></i>
    </div>
    <h3 class="text-base font-bold text-slate-800 dark:text-slate-200">Data Analisa Belum Tersedia</h3>
    <p class="text-xs text-slate-400 mt-1 max-w-sm mx-auto">Klik tombol di bawah ini untuk memulai proses analisis laporan harian otomatis dari server.</p>
    <button @click="loadAnalisa" class="mt-4 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition-all inline-flex items-center gap-2 cursor-pointer">
      <i class="fa-solid fa-play"></i> Mulai Analisis Sekarang
    </button>
  </div>

</div>
